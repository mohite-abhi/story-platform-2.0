{% extends 'base.html' %}

{% block content %}
    <h2>Story Detail</h2>
    <p><a href="{% url 'story_edit' story.id %}">Edit Story</a> | <a href="{% url 'story_delete' story.id %}">Delete Story</a></p>


    <p>{{ story.title }}</p>
    <div>Author: {{ story.author.username }}</div>
    <div>Status: {{ story.status }}</div>
    <p>{{ story.content }}</p>
    <div>Created: {{ story.created_at }}</div>
    <div>Updated: {{ story.updated_at }}</div>
    <a href="{% url 'story_list' %}"><p>← Back to Stories</p></a>

{% endblock %}
